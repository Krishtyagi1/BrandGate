name: Deploy production
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: production
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ secrets.DEPLOY_BUCKET }}
      DEPLOY_ORIGIN: ${{ secrets.DEPLOY_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate production configuration
        run: python scripts/deploy-production.py --check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM image off-host
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p .local/releases
          docker buildx build --platform linux/arm64 --load --tag "brandgate-hosted:$RELEASE_ID" .
          docker save "brandgate-hosted:$RELEASE_ID" | gzip -1 > .local/releases/production-image.tar.gz
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: BuildGateProduction
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Upload, deploy via SSM and verify HTTPS
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/deploy-production.py --image .local/releases/production-image.tar.gz --release "$RELEASE_ID"
