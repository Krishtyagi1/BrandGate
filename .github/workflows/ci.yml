name: CI
on:
  pull_request:
  push:
    branches: [prod]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: npm ci
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.txt
      - name: Prepare isolated test database role
        run: |
          mkdir -p .local/test-results .cache/tmp
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          import psycopg
          admin = 'postgresql://postgres:synthetic-ci-only-password@127.0.0.1:5432/postgres'
          with psycopg.connect(admin, autocommit=True) as conn:
              conn.execute("CREATE ROLE inkloom_app LOGIN PASSWORD 'synthetic-ci-app-only' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE")
          Path('.local/runtime.json').write_text(json.dumps({
              'adminUrl': admin,
              'databaseUrl': 'postgresql://inkloom_app:synthetic-ci-app-only@127.0.0.1:5432/postgres',
          }))
          PY
      - name: Backend tests
        run: npm run test:api
      - name: Deploy boundary tests
        run: .venv/bin/python -m unittest discover -s tests/deploy -v
      - name: Lint
        run: .venv/bin/ruff check services/api scripts/deploy-production.py tests/deploy
      - name: Shell syntax
        run: bash -n deploy/ec2/start.sh deploy/ec2/rollout.sh
      - run: npm run typecheck
      - run: npm run build
